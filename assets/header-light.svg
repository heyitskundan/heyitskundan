<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
<style>
.edge{stroke:#0F9D8A;stroke-opacity:.35;stroke-width:1.5}
.pulse{stroke-dasharray:6 8;animation:flow 2.4s linear infinite;stroke-opacity:.8}
@keyframes flow{to{stroke-dashoffset:-56}}
.pill{fill:#F6F8FA;stroke:#0F9D8A;stroke-opacity:.55}
.pilltxt{font:600 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;fill:#0B0F14}
.label{font:600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;letter-spacing:3px;fill:#0F9D8A}
.name{font:800 64px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;letter-spacing:-2px;fill:#0B0F14}
.sub{font:400 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#57606A}
.meta{font:500 14px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;fill:#57606A}
.dotlive{fill:#0F9D8A;animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
</style>
<defs><pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.5" fill="#E4E9EE"/></pattern>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".2"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient></defs>
<rect width="1200" height="320" rx="18" fill="#FFFFFF"/>
<rect width="1200" height="320" rx="18" fill="url(#g)"/>
<rect width="1200" height="320" rx="18" fill="url(#fade)"/>
<rect x=".5" y=".5" width="1199" height="319" rx="18" fill="none" stroke="#D8DEE4"/>
