<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
<style>
.edge{stroke:#2DD4BF;stroke-opacity:.35;stroke-width:1.5}
.pulse{stroke-dasharray:6 8;animation:flow 2.4s linear infinite;stroke-opacity:.8}
@keyframes flow{to{stroke-dashoffset:-56}}
.pill{fill:#111820;stroke:#2DD4BF;stroke-opacity:.55}
.pilltxt{font:600 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;fill:#E6EDF3}
.label{font:600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;letter-spacing:3px;fill:#2DD4BF}
.name{font:800 64px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;letter-spacing:-2px;fill:#E6EDF3}
.sub{font:400 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#8B98A5}
.meta{font:500 14px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;fill:#8B98A5}
.dotlive{fill:#2DD4BF;animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
</style>
<defs><pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.5" fill="#1A2430"/></pattern>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#0B0F14"/><stop offset=".55" stop-color="#0B0F14" stop-opacity=".2"/><stop offset="1" stop-color="#0B0F14" stop-opacity="0"/></linearGradient></defs>
<rect width="1200" height="320" rx="18" fill="#0B0F14"/>
<rect width="1200" height="320" rx="18" fill="url(#g)"/>
<rect width="1200" height="320" rx="18" fill="url(#fade)"/>
<rect x=".5" y=".5" width="1199" height="319" rx="18" fill="none" stroke="#1F2A36"/>
<line x1="860" y1="70" x2="1060" y2="96" class="edge"/><line x1="860" y1="70" x2="930" y2="160" class="edge"/><line x1="1060" y1="96" x2="1100" y2="200" class="edge pulse"/><line x1="930" y1="160" x2="1100" y2="200" class="edge"/><line x1="930" y1="160" x2="820" y2="236" class="edge"/><line x1="1100" y1="200" x2="1010" y2="268" class="edge pulse"/><line x1="820" y1="236" x2="1010" y2="268" class="edge"/><line x1="860" y1="70" x2="820" y2="236" class="edge"/><g transform="translate(822.6,55)"><rect width="74.80000000000001" height="30" rx="15" class="pill"/><text x="37.400000000000006" y="20" text-anchor="middle" class="pilltxt">FHIR R4</text></g><g transform="translate(1031.0,81)"><rect width="58.0" height="30" rx="15" class="pill"/><text x="29.0" y="20" text-anchor="middle" class="pilltxt">HL7v2</text></g><g transform="translate(901.0,145)"><rect width="58.0" height="30" rx="15" class="pill"/><text x="29.0" y="20" text-anchor="middle" class="pilltxt">C-CDA</text></g><g transform="translate(1071.0,185)"><rect width="58.0" height="30" rx="15" class="pill"/><text x="29.0" y="20" text-anchor="middle" class="pilltxt">SMART</text></g><g transform="translate(795.2,221)"><rect width="49.6" height="30" rx="15" class="pill"/><text x="24.8" y="20" text-anchor="middle" class="pilltxt">Epic</text></g><g transform="translate(989.4,253)"><rect width="41.2" height="30" rx="15" class="pill"/><text x="20.6" y="20" text-anchor="middle" class="pilltxt">MCP</text></g>
